{% extends "base.html" %}
{% set active_page = "tasks" %}

{% block title %}Tasks — VULNEX{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Task Board</h2>
    <button class="btn btn-primary" x-data x-on:click="$dispatch('open-create-task')">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Task
    </button>
</div>

<!-- Create Task Modal -->
<div class="modal-overlay" x-data="{ open: false }" x-on:open-create-task.window="open = true" x-on:keydown.escape.window="open = false" :class="{ active: open }">
    <div class="modal">
        <div class="modal-header">
            <h3>Create Task</h3>
            <button class="modal-close" x-on:click="open = false">&times;</button>
        </div>
        <form hx-post="/api/tasks/"
              hx-encoding="application/json"
              hx-target="#task-board"
              hx-swap="innerHTML"
              x-on:submit="open = false">
            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" required placeholder="Task title">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="3" placeholder="Optional description"></textarea>
            </div>
            <div class="form-group">
                <label>Priority</label>
                <select name="priority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                    <option value="urgent">Urgent</option>
                </select>
            </div>
            <div class="form-group">
                <label>Due Date</label>
                <input type="datetime-local" name="due_date">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" x-on:click="open = false">Cancel</button>
                <button type="submit" class="btn btn-primary">Create</button>
            </div>
        </form>
    </div>
</div>

<!-- Kanban Board -->
<div id="task-board" class="kanban-board mt-2">
    <div class="kanban-column">
        <h4>To Do</h4>
        <div class="task-list" hx-get="/api/tasks/?status=todo" hx-trigger="load" hx-swap="innerHTML"></div>
    </div>
    <div class="kanban-column">
        <h4>In Progress</h4>
        <div class="task-list" hx-get="/api/tasks/?status=in_progress" hx-trigger="load" hx-swap="innerHTML"></div>
    </div>
    <div class="kanban-column">
        <h4>Review</h4>
        <div class="task-list" hx-get="/api/tasks/?status=review" hx-trigger="load" hx-swap="innerHTML"></div>
    </div>
    <div class="kanban-column">
        <h4>Done</h4>
        <div class="task-list" hx-get="/api/tasks/?status=done" hx-trigger="load" hx-swap="innerHTML"></div>
    </div>
</div>
{% endblock %}
